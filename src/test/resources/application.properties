# --- Configuración de Base de Datos H2 para Pruebas ---

# 1. Le decimos a Spring que use H2 y que la cree en la memoria (RAM)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 2. Le decimos a Hibernate que su dialecto es H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# 3. ¡LA LÍNEA MÁS IMPORTANTE!
# "create-drop": CREA tus tablas (Usuario, Cliente) al empezar
# la prueba y DESTRUYELAS al terminar.
spring.jpa.hibernate.ddl-auto=create-drop